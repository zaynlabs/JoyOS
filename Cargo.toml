[package]
name = "joyos"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A full-screen, controller-first shell for Windows"
license = "MIT"
repository = "https://github.com/zaynlabs/JoyOS"
readme = "README.md"

[dependencies]
anyhow = "1"
dioxus = { version = "0.7.10", default-features = false, features = ["desktop", "launch", "lib"] }
directories = "6"
fluent-bundle = "0.16"
futures-channel = "0.3"
futures-util = "0.3"
gilrs = { version = "0.11", default-features = false, features = ["xinput"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
tokio = { version = "1", features = ["time"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unic-langid = "0.9"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Power", "Win32_System_Threading", "Win32_System_Registry", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_SystemInformation", "Win32_UI_Accessibility", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi"] }
windows-core = "0.62"

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
winresource = "0.1"

[dev-dependencies]
fluent-syntax = "0.12"
