<!doctype html>
<html lang="{lang}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>JoyOS</title>
<style>
  :root { --ink: #f4f1ea; --dim: rgba(244, 241, 234, .62); --bg: #0b0b0d; --glass: rgba(255, 255, 255, .08); --rim: rgba(255, 255, 255, .16); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; min-height: 100vh; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, sans-serif; user-select: none; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { font: 400 26px/1.1 Georgia, "Times New Roman", serif; font-style: italic; margin: 4px 0 18px; }
  section { margin-bottom: 22px; }
  .label { color: var(--dim); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 10px; }
  .dpad { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 8px; width: 100%; max-width: 240px; aspect-ratio: 1; margin: 0 auto; }
  .pad, .face, .bar, .home { border: 1px solid var(--rim); background: var(--glass); color: var(--ink); border-radius: 18px; font: 600 18px/1 system-ui, sans-serif; touch-action: manipulation; }
  .pad:active, .face:active, .bar:active, .home:active { background: rgba(255, 255, 255, .22); }
  .pad.up { grid-area: 1 / 2; } .pad.left { grid-area: 2 / 1; } .pad.right { grid-area: 2 / 3; } .pad.down { grid-area: 3 / 2; }
  .home { padding: 10px 16px; font-size: 14px; }
  .faces { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-width: 240px; margin: 0 auto; }
  .face { padding: 18px 0; }
  .bars { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .bar { padding: 14px 0; font-size: 15px; }
  .track { height: 160px; border-radius: 22px; border: 1px solid var(--rim); background: var(--glass); touch-action: none; }
  form { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  input { min-width: 0; font: 16px/1.2 system-ui, sans-serif; padding: 14px 16px; border-radius: 999px; border: 1px solid var(--rim); background: var(--glass); color: var(--ink); }
  input:focus, .typing input { outline: 2px solid var(--ink); outline-offset: 2px; }
  .send { padding: 0 20px; border-radius: 999px; border: none; background: var(--ink); color: var(--bg); font: 600 15px/1 system-ui, sans-serif; }
  #status { color: var(--dim); min-height: 1.4em; font-size: 13px; margin: 12px 0 0; }
</style>
</head>
<body>
<header>
  <h1 data-w="title"></h1>
  <button class="home" data-k="home" data-w="home"></button>
</header>

<section>
  <p class="label" data-w="move"></p>
  <div class="dpad">
    <button class="pad up" data-k="up" aria-label="&#9650;">&#9650;</button>
    <button class="pad left" data-k="left" aria-label="&#9664;">&#9664;</button>
    <button class="pad right" data-k="right" aria-label="&#9654;">&#9654;</button>
    <button class="pad down" data-k="down" aria-label="&#9660;">&#9660;</button>
  </div>
</section>

<section>
  <p class="label" data-w="press"></p>
  <div class="faces">
    <button class="face" data-k="a" lang="en">A</button>
    <button class="face" data-k="b" lang="en">B</button>
    <button class="face" data-k="x" lang="en">X</button>
    <button class="face" data-k="y" lang="en">Y</button>
  </div>
</section>

<section>
  <div class="bars">
    <button class="bar" data-k="lb" data-w="lb"></button>
    <button class="bar" data-k="rb" data-w="rb"></button>
    <button class="bar" data-k="select" data-w="view"></button>
    <button class="bar" data-k="start" data-w="menu"></button>
  </div>
</section>

<section>
  <div class="track" id="track"></div>
</section>

<section id="typebox">
  <p class="label" data-w="type"></p>
  <form id="type">
    <input id="text" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="send" type="submit" data-w="send"></button>
  </form>
</section>

<p id="status" role="status"></p>

<script>
  const WORDS = /*WORDS*/{};
  document.querySelectorAll("[data-w]").forEach((el) => { el.textContent = WORDS[el.dataset.w] || ""; });
  document.getElementById("text").setAttribute("aria-label", WORDS.type || "");
  const status = document.getElementById("status");

  // One connection for everything; it comes back by itself if the Wi-Fi drops.
  let ws, wait = 500;
  const connect = () => {
    ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onopen = () => { wait = 500; status.textContent = ""; };
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if ("typing" in msg) {
        document.getElementById("typebox").classList.toggle("typing", msg.typing);
        status.textContent = msg.typing ? WORDS.typing : "";
      }
    };
    ws.onclose = (e) => {
      status.textContent = WORDS.lost;
      // Turned away means the pairing is gone; the page shows the code form again.
      if (wait > 4000) { location.reload(); return; }
      setTimeout(connect, wait);
      wait = Math.min(wait * 2, 8000);
    };
  };
  connect();
  const send = (msg) => { if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg)); };

  document.querySelectorAll("[data-k]").forEach((el) => {
    el.addEventListener("click", () => {
      if (navigator.vibrate) navigator.vibrate(8);
      send({ k: el.dataset.k });
    });
  });

  // Over other apps, the pad moves the pointer; a quick tap clicks.
  const track = document.getElementById("track");
  let last = null, moved = 0;
  track.addEventListener("pointerdown", (e) => { last = [e.clientX, e.clientY]; moved = 0; track.setPointerCapture(e.pointerId); });
  track.addEventListener("pointermove", (e) => {
    if (!last) return;
    const dx = (e.clientX - last[0]) * 2, dy = (e.clientY - last[1]) * 2;
    last = [e.clientX, e.clientY];
    moved += Math.abs(dx) + Math.abs(dy);
    if (dx || dy) send({ m: [Math.round(dx), Math.round(dy)] });
  });
  track.addEventListener("pointerup", () => { if (moved < 6) send({ c: "tap" }); last = null; });

  document.getElementById("type").addEventListener("submit", (e) => {
    e.preventDefault();
    const input = document.getElementById("text");
    if (input.value) send({ t: input.value });
    input.value = "";
  });
</script>
</body>
</html>
